name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CAMANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          CAMANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :core:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}-unsigned.apk"
          fi
          ls -l "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: camandroid-linux-x86_64
          - os: windows-latest
            artifact: camandroid-windows-x86_64
          - os: macos-latest
            artifact: camandroid-macos-arm64
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -v

      - name: Build executable
        run: pyinstaller --noconfirm camandroid.spec

      - name: Package
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/camandroid.exe "out/${{ matrix.artifact }}.exe" ;;
            macOS)   ditto -c -k --keepParent dist/CamAndroid.app "out/${{ matrix.artifact }}.zip" ;;
            *)       cp dist/camandroid "out/${{ matrix.artifact }}" && chmod +x "out/${{ matrix.artifact }}" ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/out/*
          if-no-files-found: error

  interop:
    name: Interop (Kotlin server ↔ Python client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop client
        run: python -m pip install -e "desktop[dev]"
      - name: Start fake phone (real CamServer, synthetic camera)
        working-directory: android
        run: |
          ./gradlew :core:testClasses
          nohup ./gradlew :core:runFakePhone -PfakePhoneArgs="47471 $RUNNER_TEMP/code.txt" > "$RUNNER_TEMP/phone.log" 2>&1 &
          for i in $(seq 1 120); do [ -s "$RUNNER_TEMP/code.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/phone.log"
          test -s "$RUNNER_TEMP/code.txt"
      - name: Run interop test
        working-directory: desktop
        env:
          CAMANDROID_INTEROP_PORT: "47471"
          CAMANDROID_INTEROP_CODE_FILE: ${{ runner.temp }}/code.txt
        run: python -m pytest tests/test_interop.py -v -s
      - name: Phone log
        if: always()
        run: cat "$RUNNER_TEMP/phone.log"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop, interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
