name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CAMANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          CAMANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :core:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/apk/CamAndroid-${VERSION_NAME}-unsigned.apk"
          fi
          ls -l "$RUNNER_TEMP/apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports

  vcam:
    name: Virtual camera (build + DirectShow tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build camera DLL and test client (x64 and x86)
        run: |
          foreach ($arch in @("x64", "Win32")) {
            cmake -S windows/vcam -B "build/vcam-$arch" -A $arch
            if ($LASTEXITCODE) { exit 1 }
            cmake --build "build/vcam-$arch" --config Release
            if ($LASTEXITCODE) { exit 1 }
          }
          New-Item -ItemType Directory -Force windows/vcam/dist | Out-Null
          Copy-Item build/vcam-x64/Release/camandroid-vcam64.dll, build/vcam-Win32/Release/camandroid-vcam32.dll windows/vcam/dist/
          Copy-Item build/vcam-x64/Release/vcamtest.exe windows/vcam/dist/vcamtest64.exe
          Copy-Item build/vcam-Win32/Release/vcamtest.exe windows/vcam/dist/vcamtest32.exe
          Get-ChildItem windows/vcam/dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install desktop package and OpenCV (third-party DirectShow client)
        run: python -m pip install -e "desktop[dev]" opencv-python-headless

      - name: Per-user registration (what the portable app does, no admin)
        run: |
          $dll = (Resolve-Path windows/vcam/dist/camandroid-vcam64.dll).Path
          $p = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList "/s","/n","/i:user","`"$dll`"" -Wait -PassThru
          if ($p.ExitCode) { throw "regsvr32 /i:user failed: $($p.ExitCode)" }
          reg query "HKCU\Software\Classes\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance" /s
          & windows/vcam/dist/vcamtest64.exe --size 1280x720 --seconds 2 --feed 120,60,200 --expect 120,60,200
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList "/s","/u","/n","/i:user","`"$dll`"" -Wait -PassThru
          & windows/vcam/dist/vcamtest64.exe --list
          if ($LASTEXITCODE -eq 0) { throw "camera still visible after per-user uninstall" }
          exit 0

      - name: Machine-wide registration (what the installer does)
        run: |
          foreach ($pair in @(@("System32", "camandroid-vcam64.dll"), @("SysWOW64", "camandroid-vcam32.dll"))) {
            $dll = (Resolve-Path "windows/vcam/dist/$($pair[1])").Path
            $p = Start-Process "$env:SystemRoot\$($pair[0])\regsvr32.exe" -ArgumentList "/s","`"$dll`"" -Wait -PassThru
            if ($p.ExitCode) { throw "regsvr32 failed for $dll : $($p.ExitCode)" }
          }

      - name: DirectShow capture tests (placeholder, sizes, orientation, 32-bit)
        run: |
          $t = "windows/vcam/dist"
          & "$t/vcamtest64.exe" --seconds 2;                                                     if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest64.exe" --size 640x480 --seconds 2 --feed 200,40,120 --expect 200,40,120;  if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest64.exe" --size 1920x1080 --seconds 2 --feed 250,250,0 --split --expect 250,250,0; if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest32.exe" --size 1280x720 --seconds 2 --feed 10,220,30 --expect 10,220,30;   if ($LASTEXITCODE) { exit 1 }

      - name: End-to-end from Python writer (vcamtest + OpenCV)
        working-directory: desktop
        env:
          CAMANDROID_VCAMTEST: ${{ github.workspace }}\windows\vcam\dist\vcamtest64.exe
        run: python -m pytest tests/test_vcam.py -v -s

      - uses: actions/upload-artifact@v4
        with:
          name: vcam-build
          path: |
            windows/vcam/dist/camandroid-vcam64.dll
            windows/vcam/dist/camandroid-vcam32.dll
          if-no-files-found: error

  desktop:
    name: Windows app (exe + installer)
    needs: vcam
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if ("$env:GITHUB_REF" -like "refs/tags/v*") { $v = "$env:GITHUB_REF_NAME".Substring(1) } else { $v = "0.2.0-dev.$env:GITHUB_RUN_NUMBER" }
          "VERSION_NAME=$v" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: vcam-build
          path: windows/vcam/dist

      - name: Fetch adb (Android platform-tools)
        run: |
          $src = "pt/platform-tools"
          try {
            Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
            Write-Host "platform-tools zip SHA256: $((Get-FileHash pt.zip -Algorithm SHA256).Hash)"
            Expand-Archive pt.zip -DestinationPath pt
          } catch {
            Write-Host "::warning::download failed ($_); using the runner's Android SDK copy"
            $src = "$env:ANDROID_HOME/platform-tools"
          }
          New-Item -ItemType Directory -Force windows/adb | Out-Null
          Copy-Item "$src/adb.exe", "$src/AdbWinApi.dll", "$src/AdbWinUsbApi.dll", "$src/NOTICE.txt" windows/adb/
          windows/adb/adb.exe version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install
        working-directory: desktop
        run: python -m pip install -e ".[dev,build]"

      - name: Lint
        working-directory: desktop
        run: ruff check .

      - name: Test
        working-directory: desktop
        run: python -m pytest -v

      - name: Sign camera DLLs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./windows/sign.ps1 windows/vcam/dist/camandroid-vcam64.dll windows/vcam/dist/camandroid-vcam32.dll

      - name: Build camandroid.exe
        working-directory: desktop
        run: pyinstaller --noconfirm camandroid.spec

      - name: Sign camandroid.exe
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./windows/sign.ps1 desktop/dist/camandroid.exe

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          } else { $iscc = (Get-Command iscc).Source }
          & $iscc /Qp "/DAppVersion=$env:VERSION_NAME" windows/installer/camandroid.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Sign installer and collect outputs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./windows/sign.ps1 "desktop/out/CamAndroid-Setup-$env:VERSION_NAME.exe"
          Copy-Item desktop/dist/camandroid.exe "desktop/out/CamAndroid-$env:VERSION_NAME-portable.exe"
          Get-ChildItem desktop/out

      - name: Installer smoke test (silent install, camera visible, uninstall)
        run: |
          $setup = "desktop/out/CamAndroid-Setup-$env:VERSION_NAME.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "install failed: $($p.ExitCode)" }
          $app = "$env:ProgramFiles\CamAndroid"
          Get-ChildItem -Recurse $app | Select-Object FullName
          foreach ($key in @("HKLM\Software\Classes\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}\InprocServer32",
                             "HKLM\Software\Classes\WOW6432Node\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}\InprocServer32",
                             "HKLM\Software\Classes\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}")) {
            reg query $key
            if ($LASTEXITCODE) { throw "missing after install: $key" }
          }
          & "$app\adb\adb.exe" version; if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          Start-Sleep 3
          reg query "HKLM\Software\Classes\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "camera still registered after uninstall" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: camandroid-windows
          path: desktop/out/*.exe
          if-no-files-found: error

  interop:
    name: Interop (Kotlin server ↔ Python client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop client
        run: python -m pip install -e "desktop[dev]"
      - name: Start fake phone (real CamServer, synthetic camera)
        working-directory: android
        run: |
          ./gradlew :core:testClasses
          nohup ./gradlew :core:runFakePhone -PfakePhoneArgs="47471 $RUNNER_TEMP/code.txt" > "$RUNNER_TEMP/phone.log" 2>&1 &
          for i in $(seq 1 120); do [ -s "$RUNNER_TEMP/code.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/phone.log"
          test -s "$RUNNER_TEMP/code.txt"
      - name: Run interop test
        working-directory: desktop
        env:
          CAMANDROID_INTEROP_PORT: "47471"
          CAMANDROID_INTEROP_CODE_FILE: ${{ runner.temp }}/code.txt
        run: python -m pytest tests/test_interop.py -v -s
      - name: Phone log
        if: always()
        run: cat "$RUNNER_TEMP/phone.log"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, vcam, desktop, interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: camandroid-windows
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
