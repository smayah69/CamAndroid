name: CI

# Every push to the default branch (and every v* tag) publishes a GitHub Release with the APK
# and the Windows app. Other branches and pull requests only build and test.
on:
  push:
    branches: ["**", "!dependabot/**"]  # Dependabot branches are covered by their pull_request runs
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Release runs share one queue so versions are published in order and never cancelled half-way.
concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'ci-release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$(tr -d ' \r\n' < VERSION)"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            version="$base.$GITHUB_RUN_NUMBER"
            release=true
          else
            version="$base.$GITHUB_RUN_NUMBER-dev"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid version '$version' (VERSION must look like 0.3, tags like v1.2.3)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "code=$GITHUB_RUN_NUMBER"  # Android versionCode: must only ever increase
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "CamAndroid $version (publish release: $release)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.sign.outputs.mode }}
      cert: ${{ steps.sign.outputs.cert }}
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      # The release APK is built unsigned; it is signed in the next step with apksigner, so the
      # signing key and its password are never exposed to Gradle or its plugins.
      - name: Test, lint and build
        run: ./gradlew --stacktrace :core:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Sign release APK
        id: sign
        env:
          IS_RELEASE: ${{ needs.version.outputs.release }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Recommended: one secret, any long passphrase. CI then creates the signing key once and
          # stores it in the repository encrypted with that passphrase (android/signing/release.p12).
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Optional: bring your own keystore instead.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="$RUNNER_TEMP/release.p12"
          alias="${KEY_ALIAS:-camandroid}"
          export KS_PASS="${KEYSTORE_PASSWORD:-}"
          export KEY_PASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
          mode=temporary
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            mode=custom
          elif [ -n "$KS_PASS" ]; then
            # Read the key from the newest default-branch commit, so a key stored by an earlier run
            # is reused even when this run builds an older commit.
            git fetch --quiet --depth=1 origin "$DEFAULT_BRANCH"
            if git cat-file -e FETCH_HEAD:android/signing/release.p12 2>/dev/null; then
              git show FETCH_HEAD:android/signing/release.p12 > "$ks"
              mode=permanent
            elif [ "$IS_RELEASE" = true ]; then
              keytool -genkeypair -noprompt -keystore "$ks" -storetype PKCS12 -storepass:env KS_PASS \
                -alias "$alias" -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=CamAndroid" \
                -J-Dkeystore.pkcs12.keyPbeIterationCount=600000 -J-Dkeystore.pkcs12.macIterationCount=600000
              mkdir -p "$RUNNER_TEMP/new-keystore"
              cp "$ks" "$RUNNER_TEMP/new-keystore/release.p12"
              mode=generated
            fi
          fi
          if [ "$mode" = temporary ]; then
            # Throwaway key: the APK installs, but a later APK signed with another key cannot
            # update it. Set ANDROID_KEYSTORE_PASSWORD to get a permanent key.
            KS_PASS="$(openssl rand -hex 24)"
            export KS_PASS
            export KEY_PASS="$KS_PASS"
            alias=temporary
            keytool -genkeypair -noprompt -keystore "$ks" -storetype PKCS12 -storepass:env KS_PASS \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CamAndroid temporary"
            echo "::warning::APK signed with a temporary key. Add the ANDROID_KEYSTORE_PASSWORD secret so updates install over each other (README > Signing)."
          fi
          out="$RUNNER_TEMP/apk"
          mkdir -p "$out"
          "$bt/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$alias" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$out/CamAndroid-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          "$bt/apksigner" verify --print-certs "$out/CamAndroid-$VERSION_NAME.apk" | tee "$RUNNER_TEMP/certs.txt"
          cert="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "APK signing: $mode, certificate SHA-256 $cert" >> "$GITHUB_STEP_SUMMARY"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CamAndroid-$VERSION_NAME-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ runner.temp }}/CamAndroid-*-debug.apk

      # Encrypted with ANDROID_KEYSTORE_PASSWORD; the release job commits it to the repository.
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.mode == 'generated'
        with:
          name: new-signing-keystore
          path: ${{ runner.temp }}/new-keystore/release.p12
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports

  vcam:
    name: Virtual camera (build + DirectShow tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build camera DLL and test client (x64 and x86)
        run: |
          foreach ($arch in @("x64", "Win32")) {
            cmake -S windows/vcam -B "build/vcam-$arch" -A $arch
            if ($LASTEXITCODE) { exit 1 }
            cmake --build "build/vcam-$arch" --config Release
            if ($LASTEXITCODE) { exit 1 }
          }
          New-Item -ItemType Directory -Force windows/vcam/dist | Out-Null
          Copy-Item build/vcam-x64/Release/camandroid-vcam64.dll, build/vcam-Win32/Release/camandroid-vcam32.dll windows/vcam/dist/
          Copy-Item build/vcam-x64/Release/vcamtest.exe windows/vcam/dist/vcamtest64.exe
          Copy-Item build/vcam-Win32/Release/vcamtest.exe windows/vcam/dist/vcamtest32.exe
          Get-ChildItem windows/vcam/dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install desktop package and OpenCV (third-party DirectShow client)
        run: python -m pip install -e "desktop[dev]" opencv-python-headless

      - name: Per-user registration (what the portable app does, no admin)
        run: |
          $dll = (Resolve-Path windows/vcam/dist/camandroid-vcam64.dll).Path
          $p = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList "/s","/n","/i:user","`"$dll`"" -Wait -PassThru
          if ($p.ExitCode) { throw "regsvr32 /i:user failed: $($p.ExitCode)" }
          reg query "HKCU\Software\Classes\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance" /s
          & windows/vcam/dist/vcamtest64.exe --size 1280x720 --seconds 2 --feed 120,60,200 --expect 120,60,200
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$env:SystemRoot\System32\regsvr32.exe" -ArgumentList "/s","/u","/n","/i:user","`"$dll`"" -Wait -PassThru
          & windows/vcam/dist/vcamtest64.exe --list
          if ($LASTEXITCODE -eq 0) { throw "camera still visible after per-user uninstall" }
          exit 0

      - name: Machine-wide registration (what the installer does)
        run: |
          foreach ($pair in @(@("System32", "camandroid-vcam64.dll"), @("SysWOW64", "camandroid-vcam32.dll"))) {
            $dll = (Resolve-Path "windows/vcam/dist/$($pair[1])").Path
            $p = Start-Process "$env:SystemRoot\$($pair[0])\regsvr32.exe" -ArgumentList "/s","`"$dll`"" -Wait -PassThru
            if ($p.ExitCode) { throw "regsvr32 failed for $dll : $($p.ExitCode)" }
          }

      - name: DirectShow capture tests (placeholder, sizes, orientation, 32-bit)
        run: |
          $t = "windows/vcam/dist"
          & "$t/vcamtest64.exe" --seconds 2;                                                     if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest64.exe" --size 640x480 --seconds 2 --feed 200,40,120 --expect 200,40,120;  if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest64.exe" --size 1920x1080 --seconds 2 --feed 250,250,0 --split --expect 250,250,0; if ($LASTEXITCODE) { exit 1 }
          & "$t/vcamtest32.exe" --size 1280x720 --seconds 2 --feed 10,220,30 --expect 10,220,30;   if ($LASTEXITCODE) { exit 1 }

      - name: End-to-end from Python writer (vcamtest + OpenCV)
        working-directory: desktop
        env:
          CAMANDROID_VCAMTEST: ${{ github.workspace }}\windows\vcam\dist\vcamtest64.exe
        run: python -m pytest tests/test_vcam.py -v -s

      - uses: actions/upload-artifact@v4
        with:
          name: vcam-build
          path: |
            windows/vcam/dist/camandroid-vcam64.dll
            windows/vcam/dist/camandroid-vcam32.dll
          if-no-files-found: error

  desktop:
    name: Windows app (exe + installer)
    needs: [version, vcam]
    runs-on: windows-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version
        run: |
          $f = "desktop/camandroid_desktop/__init__.py"
          (Get-Content $f) -replace '^__version__ = ".*"$', "__version__ = `"$env:VERSION_NAME`"" | Set-Content $f
          Select-String '__version__' $f

      - uses: actions/download-artifact@v4
        with:
          name: vcam-build
          path: windows/vcam/dist

      - name: Fetch adb (Android platform-tools)
        run: |
          $src = "pt/platform-tools"
          try {
            Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
            Write-Host "platform-tools zip SHA256: $((Get-FileHash pt.zip -Algorithm SHA256).Hash)"
            Expand-Archive pt.zip -DestinationPath pt
          } catch {
            Write-Host "::warning::download failed ($_); using the runner's Android SDK copy"
            $src = "$env:ANDROID_HOME/platform-tools"
          }
          New-Item -ItemType Directory -Force windows/adb | Out-Null
          Copy-Item "$src/adb.exe", "$src/AdbWinApi.dll", "$src/AdbWinUsbApi.dll", "$src/NOTICE.txt" windows/adb/
          windows/adb/adb.exe version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Install
        working-directory: desktop
        run: python -m pip install -e ".[dev,build]"

      - name: Lint
        working-directory: desktop
        run: ruff check .

      - name: Test
        working-directory: desktop
        run: python -m pytest -v

      - name: Sign camera DLLs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./windows/sign.ps1 windows/vcam/dist/camandroid-vcam64.dll windows/vcam/dist/camandroid-vcam32.dll

      - name: Build camandroid.exe
        working-directory: desktop
        run: pyinstaller --noconfirm camandroid.spec

      - name: Sign camandroid.exe
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./windows/sign.ps1 desktop/dist/camandroid.exe

      - name: Build installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          } else { $iscc = (Get-Command iscc).Source }
          & $iscc /Qp "/DAppVersion=$env:VERSION_NAME" windows/installer/camandroid.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Sign installer and collect outputs
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./windows/sign.ps1 "desktop/out/CamAndroid-Setup-$env:VERSION_NAME.exe"
          Copy-Item desktop/dist/camandroid.exe "desktop/out/CamAndroid-$env:VERSION_NAME-portable.exe"
          Get-ChildItem desktop/out

      - name: Installer smoke test (silent install, camera visible, uninstall)
        run: |
          $setup = "desktop/out/CamAndroid-Setup-$env:VERSION_NAME.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "install failed: $($p.ExitCode)" }
          $app = "$env:ProgramFiles\CamAndroid"
          Get-ChildItem -Recurse $app | Select-Object FullName
          foreach ($key in @("HKLM\Software\Classes\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}\InprocServer32",
                             "HKLM\Software\Classes\WOW6432Node\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}\InprocServer32",
                             "HKLM\Software\Classes\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}")) {
            reg query $key
            if ($LASTEXITCODE) { throw "missing after install: $key" }
          }
          & "$app\adb\adb.exe" version; if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          Start-Sleep 3
          reg query "HKLM\Software\Classes\CLSID\{F216EFC3-E8A2-425E-A80C-24FBA2B0DB23}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "camera still registered after uninstall" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: camandroid-windows
          path: desktop/out/*.exe
          if-no-files-found: error

  interop:
    name: Interop (Kotlin server ↔ Python client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install desktop client
        run: python -m pip install -e "desktop[dev]"
      - name: Start fake phone (real CamServer, synthetic camera)
        working-directory: android
        run: |
          ./gradlew :core:testClasses
          nohup ./gradlew :core:runFakePhone -PfakePhoneArgs="47471 $RUNNER_TEMP/code.txt" > "$RUNNER_TEMP/phone.log" 2>&1 &
          for i in $(seq 1 120); do [ -s "$RUNNER_TEMP/code.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/phone.log"
          test -s "$RUNNER_TEMP/code.txt"
      - name: Run interop test
        working-directory: desktop
        env:
          CAMANDROID_INTEROP_PORT: "47471"
          CAMANDROID_INTEROP_CODE_FILE: ${{ runner.temp }}/code.txt
        run: python -m pytest tests/test_interop.py -v -s
      - name: Phone log
        if: always()
        run: cat "$RUNNER_TEMP/phone.log"

  release:
    name: Publish release
    needs: [version, android, vcam, desktop, interop]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SIGNING: ${{ needs.android.outputs.signing }}
      CERT: ${{ needs.android.outputs.cert }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # history and tags for the change list

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: camandroid-windows
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.android.outputs.signing == 'generated'
        with:
          name: new-signing-keystore
          path: new-keystore

      - name: Store the new signing key in the repository
        if: needs.android.outputs.signing == 'generated'
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          # Committed under the repository owner's GitHub no-reply address.
          git config user.name "$OWNER"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B add-signing-key "origin/$DEFAULT_BRANCH"
          mkdir -p android/signing
          cp new-keystore/release.p12 android/signing/release.p12
          git add android/signing/release.p12
          git commit -m "Add APK signing key, encrypted with the ANDROID_KEYSTORE_PASSWORD secret"
          git push origin "HEAD:$DEFAULT_BRANCH"
          git checkout --quiet --detach "$GITHUB_SHA"

      - name: Write checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          prev="$(gh release list --limit 30 --json tagName,isDraft \
            --jq "[.[] | select((.isDraft | not) and .tagName != \"$TAG\")][0].tagName // \"\"")"
          if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$GITHUB_SHA" 2>/dev/null; then
            changes="$(git log --no-merges --pretty='- %s (%h)' "$prev..$GITHUB_SHA" | head -50)"
          else
            changes="$(git log --no-merges --pretty='- %s (%h)' -20 "$GITHUB_SHA")"
          fi
          {
            echo "## Downloads"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`CamAndroid-$VERSION.apk\` | Android app. Install it, or install it over the previous version to update. |"
            echo "| \`CamAndroid-Setup-$VERSION.exe\` | Windows installer: app, **CamAndroid** camera and USB tools. Run it again to update. |"
            echo "| \`CamAndroid-$VERSION-portable.exe\` | Windows app without installation (no admin rights needed). |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 checksums of the files above. |"
            echo
            echo "APK signing certificate (SHA-256): \`$CERT\`"
            echo
            if [ "$SIGNING" = temporary ]; then
              echo "> [!WARNING]"
              echo "> This APK is signed with a temporary key, because the \`ANDROID_KEYSTORE_PASSWORD\` secret is not set."
              echo "> It installs normally, but Android won't install a later version over it until a permanent key is used."
              echo "> See *Signing* in the README; after that you uninstall this build once."
              echo
            fi
            if [ -n "$prev" ]; then echo "## Changes since $prev"; else echo "## Changes"; fi
            echo
            echo "$changes"
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "CamAndroid $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "CamAndroid $VERSION" \
              --notes-file notes.md --latest
          fi
          echo "Published $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
